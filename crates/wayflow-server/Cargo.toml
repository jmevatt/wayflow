[package]
name    = "wayflow-server"
description = "Input capture backends + server connection loop"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
wayflow-proto = { workspace = true }
wayflow-core  = { workspace = true }
tokio         = { workspace = true }
tokio-rustls  = { workspace = true }
rustls        = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
arboard       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# test-util is not included in features = ["full"]; needed for time::pause / advance
tokio = { workspace = true, features = ["test-util"] }

# Linux: XDG InputCapture portal + EI event stream via reis (GNOME/KDE).
# Falls back to zwlr_layer_shell_v1 capture on compositors without the portal (Sway).
# ashpd wraps zbus; reis is a pure-Rust libei/libeis implementation.
# wayland-* are already in the workspace lockfile via smithay-clipboard.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd                 = "0.10"
tokio-stream          = "0.1"
reis                  = { version = "0.2", features = ["tokio"] }
futures               = "0.3"
wayland-client        = "0.31"
wayland-protocols     = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# macOS + Windows: rdev for event tap / hooks
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rdev = "0.5"
