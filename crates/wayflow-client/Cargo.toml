[package]
name    = "wayflow-client"
description = "Input injection backends + client connection loop"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
wayflow-proto = { workspace = true }
wayflow-core  = { workspace = true }
tokio         = { workspace = true }
tokio-rustls  = { workspace = true }
rustls        = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Linux/Wayland: libei (EIS protocol) for input injection
# Linux/X11:    x11rb + XTest extension
[target.'cfg(target_os = "linux")'.dependencies]
reis = "0.2"

# macOS + Windows: rdev covers injection on both
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rdev = "0.5"

# macOS: direct CGEvent access for drag event type selection (rdev always sends MouseMoved)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.19", features = ["highsierra"] }

# Cross-platform clipboard (X11, macOS, Windows)
# Wayland clipboard is handled via smithay-clipboard (Linux only).
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies.smithay-clipboard]
version = "0.7"
