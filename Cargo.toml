[workspace]
members = [
    "crates/wayflow-proto",
    "crates/wayflow-core",
    "crates/wayflow-server",
    "crates/wayflow-client",
    "apps/wayflow-cli",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "GPL-2.0"
authors     = ["Jordan Evatt <jordan@evattlabs.com>"]
repository  = "https://github.com/jmevatt/wayflow"

[workspace.dependencies]
# async runtime
tokio          = { version = "1",    features = ["full"] }
tokio-rustls   = "0.26"

# wire protocol
postcard       = { version = "1",    features = ["alloc"] }
serde          = { version = "1",    features = ["derive"] }

# TLS
rustls         = "0.23"
rustls-pemfile = "2"
rcgen          = "0.13"

# error handling
thiserror      = "2"
anyhow         = "1"

# logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# config / platform dirs
serde_json = "1"
dirs       = "5"
toml       = "0.8"

# internal
wayflow-proto  = { path = "crates/wayflow-proto" }
wayflow-core   = { path = "crates/wayflow-core" }
wayflow-server = { path = "crates/wayflow-server" }
wayflow-client = { path = "crates/wayflow-client" }
