[workspace]
resolver = "3"
members = ["crates/wayflow-proto", "crates/wayflow-probe", "crates/wayflow-host", "crates/wayflow-keymap", "crates/wayflow-client"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jmevatt/wayflow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
